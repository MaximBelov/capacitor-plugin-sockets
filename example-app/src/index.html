<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sockets</title>
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
    <style>
      body { font-family: system-ui, sans-serif; margin: 16px; padding-top: env(safe-area-inset-top); }
      label, input, button { display: block; margin: 6px 0; font-size: 16px; }
      pre { white-space: pre-wrap; font-size: 13px; background: #f3f3f3; padding: 8px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sockets self-test</h1>
      <p>
        UDP runs between two sockets of this app on 127.0.0.1. TCP connects to an echo server: on Android, run one on the
        computer and forward it with <code>adb reverse tcp:7777 tcp:7777</code>.
      </p>
      <label for="host">TCP echo host</label>
      <input id="host" value="127.0.0.1" />
      <label for="port">TCP echo port</label>
      <input id="port" value="7777" inputmode="numeric" />
      <button id="udp">Run the UDP test</button>
      <button id="tcp">Run the TCP test</button>
      <button id="reload">Reload with a socket open</button>
      <pre id="result"></pre>
      <pre id="log"></pre>
    </main>
    <script src="./js/example.js" type="module"></script>
  </body>
</html>
